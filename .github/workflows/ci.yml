name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: swift build
      - name: Core unit checks
        run: swift run MailBridgeSelfTest
      - name: State integration tests
        run: python3 -m unittest Tests/integration_test.py
